<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>MouseFlock</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162b"/>
      <stop offset="1" stop-color="#221a3f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#7a3cf0"/>
    </linearGradient>
    <path id="pointer" d="M0 0 L0 22 L5.4 17 L9 25.4 L12.6 23.8 L9.1 15.8 L16 15.8 Z"
          stroke-linejoin="round"/>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- The mark, as in mark.svg, at 360 px. -->
  <g transform="translate(110 140) scale(0.3515625)">
    <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#tile)"/>
    <g transform="translate(25 -14)">
      <use href="#pointer" transform="translate(640 200) scale(8.4)" fill="#d9d4ff" stroke="#d9d4ff" stroke-width="1.2"/>
      <use href="#pointer" transform="translate(200 640) scale(8.4)" fill="#d9d4ff" stroke="#d9d4ff" stroke-width="1.2"/>
      <use href="#pointer" transform="translate(240 240) scale(15.5)" fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" fill="#ffffff">
    <text x="540" y="292" font-size="104" font-weight="700" letter-spacing="-2">MouseFlock</text>
    <text x="544" y="372" font-size="34" fill="#c9c4f5">One keyboard and mouse for all your PCs.</text>
    <text x="544" y="430" font-size="28" fill="#8f8ab8">Windows · open source · no setup, no cloud</text>
  </g>
</svg>
