[package]
name = "proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
proto = { path = "../../crates/proto" }
ipc = { path = "../../crates/ipc" }
win32-clipboard = { path = "../../crates/win32-clipboard" }

# Excluded from the main workspace: cargo-fuzz needs nightly Rust.
[workspace]

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_datagram"
path = "fuzz_targets/decode_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_ipc"
path = "fuzz_targets/decode_ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_png_to_dib"
path = "fuzz_targets/decode_png_to_dib.rs"
test = false
doc = false
bench = false
