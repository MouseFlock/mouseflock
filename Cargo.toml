[workspace]
resolver = "3"
members = [
    "crates/*",
    "bin/*",
    "apps/desktop/src-tauri",
    "tools/archcheck",
]
exclude = ["tools/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/sharatk/DeskHop"
publish = false

[workspace.dependencies]
# Internal crates.
proto = { path = "crates/proto" }
model = { path = "crates/model" }
engine = { path = "crates/engine" }
policy = { path = "crates/policy" }
pairing = { path = "crates/pairing" }
transport = { path = "crates/transport" }
ipc = { path = "crates/ipc" }
win32-input = { path = "crates/win32-input" }
win32-clipboard = { path = "crates/win32-clipboard" }
win32-session = { path = "crates/win32-session" }

# External crates. Versions are pinned here; crates opt in with `workspace = true`
# only when they use one. proto, model, and engine are the audit surface: adding
# a dependency to them needs a stated reason in the PR.
windows = "0.61"
windows-service = "0.8"
# QUIC and TLS on ring: aws-lc-rs would need CMake and NASM on Windows. ring
# needs clang only for ARM64, which bootstrap installs.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }
mdns-sd = "0.21"
if-addrs = "0.15"
# Pairing cryptography. Versions follow the stack spake2 0.4 builds on
# (curve25519-dalek 4, sha2 0.10), so each primitive is compiled once; update
# them together when spake2 moves.
spake2 = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"
zeroize = "1"
tokio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every `unsafe` block carries a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
