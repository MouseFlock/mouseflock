name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [decode_stream, decode_datagram, decode_ipc]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} for 5 minutes
        run: cargo +nightly fuzz run --fuzz-dir tools/fuzz ${{ matrix.target }} -- -max_total_time=300
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: tools/fuzz/artifacts/
