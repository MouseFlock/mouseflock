name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
          npm test
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo archcheck
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # ring builds C code; for ARM64 it needs clang, which the runner has.
      - run: cargo check -p transport -p win32-input -p win32-session -p win32-shell -p mouseflock-agent -p mouseflock-service -p mouseflock-desktop --target aarch64-pc-windows-msvc

  # Both packages, and an install, upgrade and uninstall of x64 (add-installer D9).
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: rustup toolchain install
      - run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build x64
        shell: powershell
        run: installer\build.ps1 -Arch x64
      - name: Build x64 again, as an upgrade
        shell: powershell
        run: installer\build.ps1 -Arch x64 -PackageOnly -OutputSuffix -rebuild
      - name: Build ARM64
        shell: powershell
        run: installer\build.ps1 -Arch arm64
      - name: Install, upgrade and uninstall x64
        shell: powershell
        run: >-
          installer\test.ps1
          -Msi (Get-Item installer\out\MouseFlock-*-x64.msi).FullName
          -UpgradeMsi (Get-Item installer\out\MouseFlock-*-x64-rebuild.msi).FullName
          -Setup (Get-Item installer\out\MouseFlock-Setup-*-x64.exe).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer
          path: |
            installer/out/MouseFlock-Setup-*-x64.exe
            installer/out/MouseFlock-Setup-*-arm64.exe
            installer/out/MouseFlock-*-x64.msi
            installer/out/MouseFlock-*-arm64.msi
            installer/out/*.log
          if-no-files-found: warn

  # engine and its dependencies must build and test off Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p proto -p model -p engine -p policy -p pairing -p ipc
