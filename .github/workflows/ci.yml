name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo archcheck
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # ring builds C code; for ARM64 it needs clang, which the runner has.
      - run: cargo check -p transport -p win32-input -p win32-session -p deskhop-agent -p deskhop-service --target aarch64-pc-windows-msvc

  # engine and its dependencies must build and test off Windows.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p proto -p model -p engine -p policy -p pairing -p ipc
